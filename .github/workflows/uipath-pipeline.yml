name: UiPath CI/CD Pipeline

on:
  pull_request:
    branches:
      - TestSuite/release
  push:
    branches:
      - TestSuite/release

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      run: |
        Write-Host "Downloading UiPath CLI..."
        
        # Create temp directory
        $tempDir = "$env:TEMP\uipath-cli"
        New-Item -Path $tempDir -ItemType Directory -Force
        
        # Download CLI from NuGet
        $cliUrl = "https://www.nuget.org/api/v2/package/UiPath.CLI/24.10.8901"
        $zipPath = "$tempDir\uipath-cli.zip"
        
        Invoke-WebRequest -Uri $cliUrl -OutFile $zipPath
        
        # Extract
        Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
        
        # Add to PATH
        $cliPath = "$tempDir\tools"
        $env:PATH = "$cliPath;$env:PATH"
        
        # Verify
        & "$cliPath\uipcli.exe" --version
        
        Write-Host "UiPath CLI installed successfully"
      shell: powershell
    
    - name: Verify Project Structure
      run: |
        Write-Host "Checking project structure..."
        if (Test-Path "${{ github.workspace }}\TestSuite\project.json") {
          Write-Host "Project file found in TestSuite folder"
        } else {
          Write-Host "Project file not found in TestSuite folder"
          Write-Host "Repository structure:"
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Depth 2 | Select-Object FullName | Write-Host
          exit 1
        }
      shell: powershell
    
    - name: Run UiPath Tests
      id: run_tests
      run: |
        Write-Host "Running UiPath tests from Tests folder..."
        
        # Set CLI path
        $tempDir = "$env:TEMP\uipath-cli"
        $cliPath = "$tempDir\tools"
        $env:PATH = "$cliPath;$env:PATH"
        
        cd "${{ github.workspace }}\TestSuite"
        
        & "$cliPath\uipcli.exe" test run `
          --accountName "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --accountForApp "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --applicationId "${{ secrets.UIPATH_CLIENT_ID }}" `
          --applicationSecret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.TestSets OR.TestSetExecutions" `
          --organizationId "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
          --tenantName "${{ secrets.UIPATH_TENANT_NAME }}" `
          --folderName "${{ secrets.UIPATH_FOLDER_NAME }}" `
          --testTarget "Tests"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tests failed with exit code $LASTEXITCODE"
          exit 1
        }
        Write-Host "All tests passed successfully"
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host "========================================="
        Write-Host "Test Execution Summary"
        Write-Host "========================================="
        if ("${{ steps.run_tests.outcome }}" -eq "success") {
          Write-Host "All tests passed"
          Write-Host "Safe to merge and deploy"
        } else {
          Write-Host "Tests failed"
          Write-Host "Do NOT merge until tests pass"
        }
        Write-Host "========================================="
      shell: powershell

  deploy:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/TestSuite/release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      run: |
        Write-Host "Downloading UiPath CLI..."
        $tempDir = "$env:TEMP\uipath-cli"
        New-Item -Path $tempDir -ItemType Directory -Force
        $cliUrl = "https://www.nuget.org/api/v2/package/UiPath.CLI/24.10.8901"
        $zipPath = "$tempDir\uipath-cli.zip"
        Invoke-WebRequest -Uri $cliUrl -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
        $cliPath = "$tempDir\tools"
        $env:PATH = "$cliPath;$env:PATH"
        & "$cliPath\uipcli.exe" --version
        Write-Host "UiPath CLI installed successfully"
      shell: powershell
    
    - name: Package UiPath Project
      run: |
        Write-Host "Packaging UiPath project..."
        
        $tempDir = "$env:TEMP\uipath-cli"
        $cliPath = "$tempDir\tools"
        $env:PATH = "$cliPath;$env:PATH"
        
        New-Item -Path "${{ github.workspace }}\output" -ItemType Directory -Force
        cd "${{ github.workspace }}\TestSuite"
        
        & "$cliPath\uipcli.exe" package pack `
          --outputPath "${{ github.workspace }}\output" `
          --version auto
        
        Write-Host "Packaging completed"
        Write-Host "Generated packages:"
        Get-ChildItem "${{ github.workspace }}\output" | Select-Object Name, Length | Write-Host
      shell: powershell
    
    - name: Deploy to UiPath Orchestrator
      run: |
        Write-Host "Deploying to UiPath Orchestrator..."
        
        $tempDir = "$env:TEMP\uipath-cli"
        $cliPath = "$tempDir\tools"
        $env:PATH = "$cliPath;$env:PATH"
        
        $packageFile = Get-ChildItem "${{ github.workspace }}\output" -Filter "*.nupkg" | Select-Object -First 1
        
        if ($packageFile) {
          Write-Host "Deploying package: $($packageFile.Name)"
          Write-Host "Target folder: ${{ secrets.UIPATH_FOLDER_NAME }}"
          
          & "$cliPath\uipcli.exe" package deploy `
            --accountName "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
            --accountForApp "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
            --applicationId "${{ secrets.UIPATH_CLIENT_ID }}" `
            --applicationSecret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
            --applicationScope "OR.Execution OR.Folders OR.Settings OR.Machines OR.Robots OR.Assets OR.Jobs" `
            --organizationId "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
            --tenantName "${{ secrets.UIPATH_TENANT_NAME }}" `
            --folderName "${{ secrets.UIPATH_FOLDER_NAME }}" `
            --packagePath "$($packageFile.FullName)"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deployment completed successfully!"
          } else {
            Write-Host "Deployment failed with exit code $LASTEXITCODE"
            exit 1
          }
        } else {
          Write-Host "Error: No package file found in output directory"
          exit 1
        }
      shell: powershell
    
    - name: Deployment Summary
      if: always()
      run: |
        Write-Host "========================================="
        Write-Host "Deployment Summary"
        Write-Host "========================================="
        Write-Host "Branch: ${{ github.ref }}"
        Write-Host "Commit: ${{ github.sha }}"
        Write-Host "Deployed by: ${{ github.actor }}"
        Write-Host "Target folder: ${{ secrets.UIPATH_FOLDER_NAME }}"
        Write-Host "Package deployed to Orchestrator"
        Write-Host "========================================="
      shell: powershell
