name: UiPath CI/CD Pipeline

on:
  pull_request:
    branches:
      - TestSuite/release
  push:
    branches:
      - TestSuite/release

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: Find Project
      run: |
        Write-Host "=== Finding project ==="
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse -ErrorAction SilentlyContinue
        if ($projectFiles) {
          $projectPath = $projectFiles[0].DirectoryName
          Write-Host "Project at: $projectPath"
          echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
        } else {
          Write-Host "ERROR: No project found"
          exit 1
        }
      shell: powershell
    
    - name: Deploy Tests to Orchestrator
      id: run_tests
      run: |
        Write-Host "=== Packaging and Deploying Tests ==="
        Write-Host "Project: $env:PROJECT_PATH"
        
        cd $env:PROJECT_PATH
        
        # Package the project with tests
        Write-Host "Packaging project with tests..."
        $outputDir = "${{ github.workspace }}\test-output"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        
        uipcli package pack `
          -P "." `
          --output-folder $outputDir `
          --outputType Tests
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Failed to package test project"
          exit 1
        }
        
        # Find the package
        $package = Get-ChildItem $outputDir -Filter "*.nupkg" | Select-Object -First 1
        
        if (-not $package) {
          Write-Host "No test package found"
          exit 1
        }
        
        Write-Host "Test package created: $($package.Name)"
        
        # Deploy the test package to Orchestrator
        Write-Host "Deploying test package to Orchestrator..."
        uipcli package deploy `
          "https://staging.uipath.com/" `
          "${{ secrets.UIPATH_TENANT_NAME }}" `
          -A "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          -I "${{ secrets.UIPATH_CLIENT_ID }}" `
          -S "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.TestSets OR.TestSetExecutions OR.Robots.Read OR.Machines.Read OR.BackgroundTasks OR.Jobs OR.Assets" `
          --identityUrl "https://staging.uipath.com/identity_" `
          -o "Test Suite Workflow" `
          -P "$($package.FullName)"
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Tests deployed successfully to Orchestrator!"
          Write-Host "Tests are now available in Orchestrator Testing section"
        } else {
          Write-Host "❌ Failed to deploy tests"
          exit 1
        }
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        if ("${{ steps.run_tests.outcome }}" -eq "success") {
          Write-Host "✅ Tests deployed to Orchestrator"
          Write-Host "Run them from: Orchestrator > Testing"
        } else {
          Write-Host "❌ Test deployment failed"
        }
        Write-Host "========================================"
      shell: powershell

  deploy:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/TestSuite/release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: Find Project
      run: |
        Write-Host "=== Finding project ==="
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse
        $projectPath = $projectFiles[0].DirectoryName
        Write-Host "Project at: $projectPath"
        echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
      shell: powershell
    
    - name: Package Project
      run: |
        Write-Host "=== Packaging ==="
        
        cd $env:PROJECT_PATH
        $outputDir = "${{ github.workspace }}\output"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        
        uipcli package pack -P "." --output-folder $outputDir
        
        $package = Get-ChildItem $outputDir -Filter "*.nupkg" | Select-Object -First 1
        if ($package) {
          Write-Host "Package created: $($package.Name)"
        } else {
          Write-Host "ERROR: No package created"
          exit 1
        }
      shell: powershell
    
    - name: Deploy to Orchestrator
      run: |
        Write-Host "=== Deploying to Orchestrator ==="
        
        $package = Get-ChildItem "${{ github.workspace }}\output" -Filter "*.nupkg" | Select-Object -First 1
        
        uipcli package deploy `
          "https://staging.uipath.com/" `
          "${{ secrets.UIPATH_TENANT_NAME }}" `
          -A "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          -I "${{ secrets.UIPATH_CLIENT_ID }}" `
          -S "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.Machines OR.Robots OR.Assets OR.Jobs" `
          --identityUrl "https://staging.uipath.com/identity_" `
          -o "Test Suite Workflow" `
          -P "$($package.FullName)"
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ SUCCESS: Deployed to Orchestrator!"
        } else {
          Write-Host "❌ ERROR: Deployment failed"
          exit 1
        }
      shell: powershell
    
    - name: Deployment Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        Write-Host "DEPLOYED TO: Test Suite Workflow"
        Write-Host "COMMIT: ${{ github.sha }}"
        Write-Host "========================================"
      shell: powershell
