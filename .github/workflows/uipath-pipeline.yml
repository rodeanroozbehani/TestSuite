name: UiPath CI/CD Pipeline

on:
  pull_request:
    branches:
      - TestSuite/release
  push:
    branches:
      - TestSuite/release

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: List repository structure
      run: |
        Write-Host "=== Repository Structure ==="
        Write-Host "Working directory: ${{ github.workspace }}"
        Get-ChildItem "${{ github.workspace }}" -Recurse -Depth 2 | Select-Object FullName
      shell: powershell
    
    - name: Verify Project Structure
      run: |
        Write-Host "=== Checking for project.json ==="
        
        # Try to find project.json
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse -ErrorAction SilentlyContinue
        
        if ($projectFiles) {
          Write-Host "Found project.json files:"
          $projectFiles | ForEach-Object { Write-Host $_.FullName }
          
          # Use the first one found
          $projectPath = $projectFiles[0].DirectoryName
          Write-Host "Using project at: $projectPath"
          
          # Save for later steps
          echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
        } else {
          Write-Host "ERROR: No project.json found"
          exit 1
        }
      shell: powershell
    
    - name: Authenticate to Orchestrator
      run: |
        Write-Host "=== Authenticating ==="
        
        uipcli orchestrator login `
          --account-name "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --client-id "${{ secrets.UIPATH_CLIENT_ID }}" `
          --client-secret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --organization-id "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
          --tenant "${{ secrets.UIPATH_TENANT_NAME }}"
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Authentication successful"
        } else {
          Write-Host "Authentication failed"
          exit 1
        }
      shell: powershell
    
    - name: Run Tests
      id: run_tests
      run: |
        Write-Host "=== Running Tests ==="
        Write-Host "Project path: $env:PROJECT_PATH"
        
        cd $env:PROJECT_PATH
        
        uipcli test run `
          --project-path . `
          --orchestrator-url "https://cloud.uipath.com/${{ secrets.UIPATH_ACCOUNT_NAME }}/${{ secrets.UIPATH_TENANT_NAME }}" `
          --orchestrator-folder "${{ secrets.UIPATH_FOLDER_NAME }}"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tests failed"
          exit 1
        }
        
        Write-Host "Tests passed"
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        if ("${{ steps.run_tests.outcome }}" -eq "success") {
          Write-Host "PASSED - Safe to merge"
        } else {
          Write-Host "FAILED - Do not merge"
        }
        Write-Host "========================================"
      shell: powershell

  deploy:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/TestSuite/release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: Find Project
      run: |
        Write-Host "=== Finding project ==="
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse -ErrorAction SilentlyContinue
        if ($projectFiles) {
          $projectPath = $projectFiles[0].DirectoryName
          Write-Host "Project at: $projectPath"
          echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
        } else {
          Write-Host "ERROR: No project found"
          exit 1
        }
      shell: powershell
    
    - name: Authenticate and Deploy
      run: |
        Write-Host "=== Authenticating ==="
        
        uipcli orchestrator login `
          --account-name "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --client-id "${{ secrets.UIPATH_CLIENT_ID }}" `
          --client-secret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --organization-id "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
          --tenant "${{ secrets.UIPATH_TENANT_NAME }}"
        
        Write-Host "=== Packaging ==="
        cd $env:PROJECT_PATH
        
        $outputDir = "${{ github.workspace }}\output"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        
        uipcli package pack --output-folder $outputDir
        
        Write-Host "=== Deploying ==="
        $package = Get-ChildItem $outputDir -Filter "*.nupkg" | Select-Object -First 1
        
        if ($package) {
          Write-Host "Deploying: $($package.Name)"
          
          uipcli package deploy `
            --package-path $package.FullName `
            --orchestrator-url "https://cloud.uipath.com/${{ secrets.UIPATH_ACCOUNT_NAME }}/${{ secrets.UIPATH_TENANT_NAME }}" `
            --orchestrator-folder "${{ secrets.UIPATH_FOLDER_NAME }}"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS: Deployed to ${{ secrets.UIPATH_FOLDER_NAME }}"
          } else {
            Write-Host "ERROR: Deployment failed"
            exit 1
          }
        } else {
          Write-Host "ERROR: No package found"
          exit 1
        }
      shell: powershell
