name: UiPath CI/CD Pipeline

on:
  pull_request:
    branches:
      - TestSuite/release
  push:
    branches:
      - TestSuite/release

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: Find Project
      run: |
        Write-Host "=== Finding project ==="
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse -ErrorAction SilentlyContinue
        if ($projectFiles) {
          $projectPath = $projectFiles[0].DirectoryName
          Write-Host "Project at: $projectPath"
          echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
        } else {
          Write-Host "ERROR: No project found"
          exit 1
        }
      shell: powershell
    
    - name: Run Tests in Orchestrator
      id: run_tests
      run: |
        Write-Host "=== Running Tests in Orchestrator ==="
        Write-Host "Project: $env:PROJECT_PATH"
        
        cd $env:PROJECT_PATH
        
        # Pre-create the .generated folder to avoid cleanup errors
        New-Item -Path ".\.generated" -ItemType Directory -Force | Out-Null
        Write-Host "Created .generated folder"
        
        # Create output directory for test results
        $testOutputDir = "${{ github.workspace }}\test-results"
        New-Item -Path $testOutputDir -ItemType Directory -Force | Out-Null
        
        # Run tests
        Write-Host "Executing tests..."
        
        uipcli test run `
          "https://staging.uipath.com/" `
          "${{ secrets.UIPATH_TENANT_NAME }}" `
          -A "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          -I "${{ secrets.UIPATH_CLIENT_ID }}" `
          -S "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.TestSets OR.TestSetExecutions OR.Robots.Read OR.Machines.Read OR.BackgroundTasks OR.Jobs OR.Assets" `
          --identityUrl "https://staging.uipath.com/identity_" `
          -o "Test Suite Workflow" `
          -P "." `
          --out "junit" `
          -r "$testOutputDir\results.xml"
        
        $testExitCode = $LASTEXITCODE
        
        # Clean up
        if (Test-Path ".\.generated") {
          Remove-Item ".\.generated" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        if ($testExitCode -eq 0) {
          Write-Host "✅ ALL TESTS PASSED!"
        } else {
          Write-Host "❌ TESTS FAILED (Exit code: $testExitCode)"
          exit $testExitCode
        }
      shell: powershell
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ github.workspace }}\test-results\*.xml
        if-no-files-found: ignore
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        Write-Host "TEST EXECUTION SUMMARY"
        Write-Host "========================================"
        if ("${{ steps.run_tests.outcome }}" -eq "success") {
          Write-Host "✅ PASSED - Safe to merge"
        } else {
          Write-Host "❌ FAILED - Do not merge"
          Write-Host "Check test results in Orchestrator:"
          Write-Host "https://staging.uipath.com/${{ secrets.UIPATH_ACCOUNT_NAME }}/${{ secrets.UIPATH_TENANT_NAME }}/orchestrator_/testing"
        }
        Write-Host "========================================"
      shell: powershell

  deploy:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/TestSuite/release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup UiPath CLI
      uses: Mikael-RnD/setup-uipath@v2
      with:
        platform-version: '24.10'
    
    - name: Find Project
      run: |
        Write-Host "=== Finding project ==="
        $projectFiles = Get-ChildItem "${{ github.workspace }}" -Filter "project.json" -Recurse
        $projectPath = $projectFiles[0].DirectoryName
        Write-Host "Project at: $projectPath"
        echo "PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
      shell: powershell
    
    - name: Package Project
      run: |
        Write-Host "=== Packaging ==="
        
        cd $env:PROJECT_PATH
        $outputDir = "${{ github.workspace }}\output"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        
        uipcli package pack "." -o $outputDir
        
        $package = Get-ChildItem $outputDir -Filter "*.nupkg" | Select-Object -First 1
        if ($package) {
          Write-Host "Package created: $($package.Name)"
        } else {
          Write-Host "ERROR: No package created"
          exit 1
        }
      shell: powershell
    
    - name: Deploy to Orchestrator
      run: |
        Write-Host "=== Deploying to Orchestrator ==="
        
        $package = Get-ChildItem "${{ github.workspace }}\output" -Filter "*.nupkg" | Select-Object -First 1
        
        uipcli package deploy `
          "https://staging.uipath.com/" `
          "${{ secrets.UIPATH_TENANT_NAME }}" `
          -A "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          -I "${{ secrets.UIPATH_CLIENT_ID }}" `
          -S "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.Machines OR.Robots OR.Assets OR.Jobs" `
          --identityUrl "https://staging.uipath.com/identity_" `
          -o "Test Suite Workflow" `
          -P "$($package.FullName)"
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ SUCCESS: Deployed to Orchestrator!"
        } else {
          Write-Host "❌ ERROR: Deployment failed"
          exit 1
        }
      shell: powershell
    
    - name: Deployment Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        Write-Host "DEPLOYED TO: Test Suite Workflow"
        Write-Host "COMMIT: ${{ github.sha }}"
        Write-Host "View in Orchestrator:"
        Write-Host "https://staging.uipath.com/${{ secrets.UIPATH_ACCOUNT_NAME }}/${{ secrets.UIPATH_TENANT_NAME }}/orchestrator_/"
        Write-Host "========================================"
      shell: powershell
