name: UiPath CI/CD Pipeline

on:
  pull_request:
    branches:
      - TestSuite/release
  push:
    branches:
      - TestSuite/release

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Install UiPath CLI
      run: |
        Write-Host "=== Installing UiPath CLI ==="
        
        # Download MSI installer directly
        $cliUrl = "https://download.uipath.com/versions/23.10.8753.32995/UiPathCLI.msi"
        $msiPath = "$env:TEMP\UiPathCLI.msi"
        
        Write-Host "Downloading UiPath CLI from: $cliUrl"
        
        try {
          Invoke-WebRequest -Uri $cliUrl -OutFile $msiPath -UseBasicParsing
          Write-Host "Download successful"
          
          Write-Host "Installing MSI..."
          $installArgs = @("/i", $msiPath, "/quiet", "/norestart")
          Start-Process msiexec.exe -ArgumentList $installArgs -Wait -NoNewWindow
          
          Write-Host "Adding to PATH..."
          $cliPath = "C:\Program Files\UiPath\Studio\uipcli"
          if (Test-Path $cliPath) {
            $env:PATH = "$env:PATH;$cliPath"
            [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Process")
          } else {
            Write-Host "WARNING: Default path not found, searching for uipcli..."
            $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "uipcli.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $cliPath = $found.DirectoryName
              Write-Host "Found at: $cliPath"
              $env:PATH = "$env:PATH;$cliPath"
              [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Process")
            }
          }
          
          # Verify installation
          Write-Host "Verifying installation..."
          & uipcli --version
          
          Write-Host "=== UiPath CLI installed successfully ==="
          
        } catch {
          Write-Host "ERROR: Failed to download or install CLI"
          Write-Host $_.Exception.Message
          exit 1
        }
      shell: powershell
    
    - name: Verify Project Structure
      run: |
        Write-Host "=== Verifying project structure ==="
        $projectPath = "${{ github.workspace }}\TestSuite\project.json"
        
        if (Test-Path $projectPath) {
          Write-Host "SUCCESS: project.json found"
        } else {
          Write-Host "ERROR: project.json not found at $projectPath"
          Write-Host "Repository contents:"
          Get-ChildItem "${{ github.workspace }}" -Recurse -Depth 2 | Select-Object FullName
          exit 1
        }
      shell: powershell
    
    - name: Run UiPath Tests
      id: run_tests
      run: |
        Write-Host "=== Running UiPath Tests ==="
        
        cd "${{ github.workspace }}\TestSuite"
        
        Write-Host "Account: ${{ secrets.UIPATH_ACCOUNT_NAME }}"
        Write-Host "Tenant: ${{ secrets.UIPATH_TENANT_NAME }}"
        Write-Host "Folder: ${{ secrets.UIPATH_FOLDER_NAME }}"
        
        uipcli test run `
          --accountName "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --accountForApp "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
          --applicationId "${{ secrets.UIPATH_CLIENT_ID }}" `
          --applicationSecret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
          --applicationScope "OR.Execution OR.Folders OR.Settings OR.TestSets OR.TestSetExecutions" `
          --organizationId "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
          --tenantName "${{ secrets.UIPATH_TENANT_NAME }}" `
          --folderName "${{ secrets.UIPATH_FOLDER_NAME }}" `
          --testTarget "Tests"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Tests failed"
          exit 1
        }
        
        Write-Host "SUCCESS: All tests passed"
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        Write-Host "TEST EXECUTION SUMMARY"
        Write-Host "========================================"
        
        $outcome = "${{ steps.run_tests.outcome }}"
        if ($outcome -eq "success") {
          Write-Host "STATUS: PASSED"
          Write-Host "Safe to merge and deploy"
        } else {
          Write-Host "STATUS: FAILED"
          Write-Host "Do NOT merge until tests pass"
        }
        
        Write-Host "========================================"
      shell: powershell

  deploy:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/TestSuite/release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Install UiPath CLI
      run: |
        Write-Host "=== Installing UiPath CLI ==="
        $cliUrl = "https://download.uipath.com/versions/23.10.8753.32995/UiPathCLI.msi"
        $msiPath = "$env:TEMP\UiPathCLI.msi"
        Invoke-WebRequest -Uri $cliUrl -OutFile $msiPath -UseBasicParsing
        $installArgs = @("/i", $msiPath, "/quiet", "/norestart")
        Start-Process msiexec.exe -ArgumentList $installArgs -Wait -NoNewWindow
        $cliPath = "C:\Program Files\UiPath\Studio\uipcli"
        if (Test-Path $cliPath) {
          $env:PATH = "$env:PATH;$cliPath"
        } else {
          $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "uipcli.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $env:PATH = "$env:PATH;$($found.DirectoryName)"
          }
        }
        uipcli --version
        Write-Host "=== CLI installed ==="
      shell: powershell
    
    - name: Package UiPath Project
      run: |
        Write-Host "=== Packaging project ==="
        
        $outputDir = "${{ github.workspace }}\output"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        cd "${{ github.workspace }}\TestSuite"
        
        uipcli package pack --outputPath $outputDir --version auto
        
        Write-Host "Generated packages:"
        Get-ChildItem $outputDir | Select-Object Name, Length
      shell: powershell
    
    - name: Deploy to Orchestrator
      run: |
        Write-Host "=== Deploying to Orchestrator ==="
        
        $packageFile = Get-ChildItem "${{ github.workspace }}\output" -Filter "*.nupkg" | Select-Object -First 1
        
        if ($packageFile) {
          Write-Host "Package: $($packageFile.Name)"
          Write-Host "Folder: ${{ secrets.UIPATH_FOLDER_NAME }}"
          
          uipcli package deploy `
            --accountName "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
            --accountForApp "${{ secrets.UIPATH_ACCOUNT_NAME }}" `
            --applicationId "${{ secrets.UIPATH_CLIENT_ID }}" `
            --applicationSecret "${{ secrets.UIPATH_CLIENT_SECRET }}" `
            --applicationScope "OR.Execution OR.Folders OR.Settings OR.Machines OR.Robots OR.Assets OR.Jobs" `
            --organizationId "${{ secrets.UIPATH_ORGANIZATION_ID }}" `
            --tenantName "${{ secrets.UIPATH_TENANT_NAME }}" `
            --folderName "${{ secrets.UIPATH_FOLDER_NAME }}" `
            --packagePath "$($packageFile.FullName)"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS: Deployed to Orchestrator"
          } else {
            Write-Host "ERROR: Deployment failed"
            exit 1
          }
        } else {
          Write-Host "ERROR: No package found"
          exit 1
        }
      shell: powershell
    
    - name: Deployment Summary
      if: always()
      run: |
        Write-Host ""
        Write-Host "========================================"
        Write-Host "DEPLOYMENT SUMMARY"
        Write-Host "========================================"
        Write-Host "Branch: ${{ github.ref }}"
        Write-Host "Commit: ${{ github.sha }}"
        Write-Host "User: ${{ github.actor }}"
        Write-Host "Folder: ${{ secrets.UIPATH_FOLDER_NAME }}"
        Write-Host "========================================"
      shell: powershell
